name: Donnees

# Rythme : GitHub honore les déclenchements programmés « au mieux » et écarte
# largement les cadences très serrées. Avec « */10 » (toutes les 10 minutes),
# trois exécutions seulement ont eu lieu en vingt heures, soit un passage toutes
# les cinq à huit heures — au point que les garde-fous d'âge de la carte
# rejetaient les fichiers pré-calculés et renvoyaient tout le monde en direct
# sur les serveurs d'origine, exactement ce que ce robot doit éviter.
# Un quart d'heure est une cadence que GitHub tient beaucoup plus régulièrement,
# et elle reste sous tous les seuils de fraîcheur du client (1 h pour les
# séismes, le plus exigeant).
# Mesure sur ce depot meme : avec "*/10", trois passages en vingt heures ; avec
# "*/15", AUCUN en sept heures. Le planificateur de GitHub est explicitement
# "best effort" sur les depots publics, et il ecarte massivement les cadences
# serrees exprimees en */n, qui tombent toutes sur les memes minutes rondes que
# celles de milliers d'autres depots.
# On declare donc des minutes DECALEES et explicites plutot qu'un pas : cela
# evite la bousculade de la minute zero, ce qui ameliore nettement le taux
# d'execution reel. Cela ne garantit rien -- GitHub ne garantit rien -- d'ou les
# tolerances d'age relevees cote carte : une donnee un peu ancienne, affichee
# avec son age, vaut mieux qu'une absence.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      slow:
        description: "Forcer la reconstruction des périmètres brûlés (Copernicus)"
        type: boolean
        default: false

permissions:
  contents: write

# Une exécution bloquée ne doit jamais retenir la suivante : on annule celle en
# cours plutôt que d'empiler une file d'attente qui finit par étouffer le
# déclencheur programmé.
concurrency:
  group: data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # Aucune étape « setup-node » : l'image ubuntu-latest fournit déjà une
      # version de Node récente, largement suffisante pour `fetch` natif.
      # Cela retire une étape et quelques secondes à chaque passage.
      - name: Version de Node
        run: node --version

      # Le script vit dans le dépôt (scripts/build.js) et n'est plus recopié
      # depuis ce fichier : une seule source de vérité, lisible et versionnée.
      - name: Collecte
        run: node scripts/build.js fast

      - name: Périmètres brûlés (sur demande)
        if: github.event_name == 'workflow_dispatch' && inputs.slow
        run: node scripts/build.js slow

      # Le script n'écrit un fichier que si la donnée a réellement changé :
      # un cycle calme ne produit donc aucun commit. Auparavant, meta.json
      # portait un horodatage à chaque passage, ce qui garantissait un commit
      # toutes les dix minutes pour rien et faisait grossir l'historique de
      # près de 200 ko par cycle.
      - name: Publier
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Aucun changement — rien à publier."
            exit 0
          fi
          git commit -m "Donnees $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Trois tentatives : le déploiement Pages ou une modification manuelle
          # peuvent avoir avancé la branche entre-temps. En cas d'échec durable,
          # le travail échoue VRAIMENT — l'ancienne version terminait en succès
          # même quand rien n'avait été poussé, ce qui masquait le problème.
          for i in 1 2 3; do
            if git push; then
              echo "Publié à la tentative $i."
              exit 0
            fi
            echo "Tentative $i refusée, resynchronisation…"
            git pull --rebase --autostash origin main
          done
          echo "::error::Impossible de publier les données après trois tentatives."
          exit 1
